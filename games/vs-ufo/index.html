<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Defender - Joystick Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        #gameCanvas {
            border: 2px solid #333;
            background: #0a0a2a;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            pointer-events: none; /* Agar tidak mengganggu touch */
        }
        
        /* Joystick Styles */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none; /* Hidden on Desktop by default */
            touch-action: none;
            z-index: 10;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(79, 195, 247, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(79, 195, 247, 0.5);
            pointer-events: none; /* Event tembus ke zone */
        }

        /* Show joystick only on screens smaller than 768px */
        @media (max-width: 768px) {
            #joystick-zone {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span> | HP: <span id="hp">5</span></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const hpEl = document.getElementById('hp');

        // Resize canvas to fit screen (mobile-friendly)
        function resizeCanvas() {
            const scale = Math.min(window.innerWidth / 800, window.innerHeight / 600, 1);
            canvas.style.transform = `scale(${scale})`;
            canvas.style.transformOrigin = 'center center';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game state
        const state = {
            score: 0,
            hp: 10,
            gameOver: false,
            keys: { w: false, a: false, s: false, d: false },
            // Joystick state
            joystick: { x: 0, y: 0, active: false }
        };

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            width: 40,
            height: 30,
            speed: 5,
            lastShot: 0,
            cooldown: 200 // ms
        };

        // Projectiles & Enemies
        const bullets = [];
        const ufos = [];
        const ufoBullets = [];

        // --- JOYSTICK LOGIC ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const maxRadius = 35; // Batas gerak knob

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            state.joystick.active = true;
            handleJoystick(e.touches[0]);
        }, { passive: false });

        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Mencegah scroll layar
            if (state.joystick.active) {
                handleJoystick(e.touches[0]);
            }
        }, { passive: false });

        joystickZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            state.joystick.active = false;
            state.joystick.x = 0;
            state.joystick.y = 0;
            // Reset knob position
            joystickKnob.style.transform = `translate(-50%, -50%)`;
        });

        function handleJoystick(touch) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Hitung jarak dari tengah
            const deltaX = touch.clientX - centerX;
            const deltaY = touch.clientY - centerY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            // Hitung sudut
            const angle = Math.atan2(deltaY, deltaX);

            // Batasi gerakan knob agar tidak keluar lingkaran
            const cappedDistance = Math.min(distance, maxRadius);
            
            // Pindahkan visual Knob
            const knobX = Math.cos(angle) * cappedDistance;
            const knobY = Math.sin(angle) * cappedDistance;
            joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;

            // Normalisasi output (-1 sampai 1) untuk pergerakan player
            state.joystick.x = knobX / maxRadius;
            state.joystick.y = knobY / maxRadius;
        }
        // --- END JOYSTICK LOGIC ---


        // Spawn UFO
        function spawnUFO() {
            const size = 30 + Math.random() * 20;
            ufos.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size / 2,
                speed: 1 + Math.random() * 2,
                shootChance: 0.002 + state.score * 0.0001,
                lastShot: 0,
                shootCooldown: 1500
            });
        }

        // Input Handling (Keyboard)
        window.addEventListener('keydown', (e) => {
            if (state.gameOver && e.key === ' ') restart();
            switch(e.key.toLowerCase()) {
                case 'w': state.keys.w = true; break;
                case 'a': state.keys.a = true; break;
                case 's': state.keys.s = true; break;
                case 'd': state.keys.d = true; break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': state.keys.w = false; break;
                case 'a': state.keys.a = false; break;
                case 's': state.keys.s = false; break;
                case 'd': state.keys.d = false; break;
            }
        });

        // Input Handling (Tap to Restart on Mobile)
        window.addEventListener('touchstart', (e) => {
            // Jika game over, tap dimana saja untuk restart
            if (state.gameOver) {
                restart();
            }
        });

        // Shooting (player auto-shoot)
        function playerShoot() {
            const now = Date.now();
            if (now - player.lastShot > player.cooldown) {
                bullets.push({
                    x: player.x,
                    y: player.y - 5,
                    width: 4,
                    height: 12,
                    speed: 7
                });
                player.lastShot = now;
            }
        }

        // UFO shooting
        function ufoShoot(ufo) {
            const now = Date.now();
            if (now - ufo.lastShot > ufo.shootCooldown && Math.random() < ufo.shootChance) {
                ufoBullets.push({
                    x: ufo.x + ufo.width / 2,
                    y: ufo.y + ufo.height,
                    width: 4,
                    height: 10,
                    speed: 4 + Math.random() * 2
                });
                ufo.lastShot = now;
            }
        }

        // Collision detection
        function collides(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        // Update game logic
        function update() {
            if (state.gameOver) return;

            // --- MOVEMENT LOGIC (Keyboard + Joystick Mixed) ---
            let moveX = 0;
            let moveY = 0;

            // Cek Keyboard
            if (state.keys.a) moveX -= 1;
            if (state.keys.d) moveX += 1;
            if (state.keys.w) moveY -= 1;
            if (state.keys.s) moveY += 1;

            // Cek Joystick (Prioritas jika aktif)
            if (state.joystick.active) {
                moveX = state.joystick.x;
                moveY = state.joystick.y;
            }

            // Terapkan gerakan
            player.x += moveX * player.speed;
            player.y += moveY * player.speed;

            // Batasi agar tidak keluar layar
            player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
            player.y = Math.max(20, Math.min(canvas.height - 30, player.y));
            // --- END MOVEMENT ---

            // Auto-shoot
            playerShoot();

            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < -10) bullets.splice(i, 1);
            }

            // Update UFOs
            if (Math.random() < 0.02 + state.score * 0.0001) spawnUFO();

            for (let i = ufos.length - 1; i >= 0; i--) {
                const ufo = ufos[i];
                ufo.y += ufo.speed;

                if (ufo.y > canvas.height) {
                    ufos.splice(i, 1);
                    continue;
                }

                ufoShoot(ufo);

                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (collides(bullets[j], ufo)) {
                        bullets.splice(j, 1);
                        ufos.splice(i, 1);
                        state.score += 10;
                        scoreEl.textContent = state.score;
                        break;
                    }
                }
            }

            // Update UFO bullets
            for (let i = ufoBullets.length - 1; i >= 0; i--) {
                ufoBullets[i].y += ufoBullets[i].speed;
                if (ufoBullets[i].y > canvas.height) {
                    ufoBullets.splice(i, 1);
                    continue;
                }

                if (collides(ufoBullets[i], player)) {
                    ufoBullets.splice(i, 1);
                    state.hp--;
                    hpEl.textContent = state.hp;
                    if (state.hp <= 0) {
                        state.gameOver = true;
                    }
                }
            }
        }

        // Render
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 100; i++) {
                const x = (i * 137) % canvas.width;
                const y = (i * 223) % canvas.height;
                ctx.globalAlpha = 0.3 + (Math.sin(Date.now()/1000 + i) * 0.3);
                ctx.fillRect(x, y, 1.5, 1.5);
            }
            ctx.globalAlpha = 1;

            // Draw player
            ctx.fillStyle = '#4fc3f7';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 15);
            ctx.lineTo(player.x - 15, player.y + 15);
            ctx.lineTo(player.x + 15, player.y + 15);
            ctx.closePath();
            ctx.fill();

            // Draw bullets
            ctx.fillStyle = '#ff5252';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x - 2, bullet.y, bullet.width, bullet.height);
            });

            // Draw UFOs
            ufos.forEach(ufo => {
                ctx.fillStyle = '#8bc34a';
                ctx.beginPath();
                ctx.arc(ufo.x + ufo.width/2, ufo.y + ufo.height/2, ufo.width/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#689f38';
                ctx.fillRect(ufo.x, ufo.y + ufo.height/3, ufo.width, ufo.height/3);
            });

            // Draw UFO bullets
            ctx.fillStyle = '#ff9800';
            ufoBullets.forEach(bullet => {
                ctx.fillRect(bullet.x - 2, bullet.y, bullet.width, bullet.height);
            });

            // Game Over
            if (state.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '40px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '24px "Courier New", monospace';
                ctx.fillText(`Score: ${state.score}`, canvas.width / 2, canvas.height / 2 + 20);
                
                // Pesan berbeda untuk Desktop vs Mobile
                if (window.innerWidth < 768) {
                    ctx.fillText('Tap screen to restart', canvas.width / 2, canvas.height / 2 + 60);
                } else {
                    ctx.fillText('Press SPACE to restart', canvas.width / 2, canvas.height / 2 + 60);
                }
                ctx.textAlign = 'left';
            }
        }

        function restart() {
            state.score = 0;
            state.hp = 10;
            state.gameOver = false;
            bullets.length = 0;
            ufos.length = 0;
            ufoBullets.length = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height - 60;
            scoreEl.textContent = '0';
            hpEl.textContent = '10';
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
        setInterval(spawnUFO, 2000);
    </script>
</body>
</html>
