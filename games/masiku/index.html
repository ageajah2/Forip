<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Now U Catch Me</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2b0000, #120000, #000000);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .text {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #ff2a2a;
            text-transform: uppercase;
            text-shadow:
                0 0 10px rgba(255, 42, 42, 0.6),
                0 0 20px rgba(255, 42, 42, 0.4),
                0 0 40px rgba(255, 42, 42, 0.2);
            animation: glow 2.5s ease-in-out infinite alternate;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .text {
                font-size: 32px;
            }
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 8px rgba(255, 42, 42, 0.4),
                    0 0 16px rgba(255, 42, 42, 0.25);
            }

            to {
                text-shadow:
                    0 0 20px rgba(255, 42, 42, 0.9),
                    0 0 40px rgba(255, 42, 42, 0.6),
                    0 0 60px rgba(255, 42, 42, 0.4);
            }
        }
    </style>
</head>

<body>
    <div class="text" id="main-text">you caught me</div>
    <script>
        const phrases = [
            "You Caught Me",            // English
            "Kamu Menangkapku",          // Indonesian
            "捕まえたね",                // Japanese
            "날 잡았네",                 // Korean
            "Tu m'as eu",               // French
            "Me Atrapaste",              // Spanish
            "Du hast mich erwischt",     // German
            "Mi hai preso",             // Italian
            "Ты поймал меня",            // Russian
            "لقد أمسكت بي"               // Arabic
        ];

        const textElement = document.getElementById('main-text');
        let currentIndex = 0;

        function changeText() {
            currentIndex = (currentIndex + 1) % phrases.length;
            textElement.innerText = phrases[currentIndex];
        }

        setInterval(changeText, 1000);
    </script>
</body>

</html>
