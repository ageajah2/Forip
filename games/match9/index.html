<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Game Match-3 Bentuk</title>
  <style>
    :root {
      /* tighter responsive cell size to prevent horizontal overflow */
      --cell-size: min(11vw, 58px);
      --gap-size: min(1.2vw, 6px);
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0 0px;           /* prevent edge clipping on small screens */
      touch-action: none;
      overflow: hidden;        /* no horizontal scroll */
    }

    h1 {
      position: absolute;
      top: 6px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: clamp(15px, 4.5vw, 28px);
      margin: 0;
      color: #ffd740;
      letter-spacing: 1px;
      pointer-events: none;
    }

    #wrap {
      position: relative;
      margin-top: clamp(32px, 10vw, 64px);
      max-width: 100vw;         /* hard limit */
      overflow: visible;       /* allow HUD to be visible */
    }

    #hud {
      position: absolute;
      top: calc(-1 * clamp(28px, 7vw, 44px));
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      font-size: clamp(12px, 3.5vw, 18px);
      padding: 0 4px;
      z-index: 5;              /* ensure HUD stays visible */
      pointer-events: none;
    }

    #game {
      display: grid;
      grid-template-columns: repeat(8, var(--cell-size));
      gap: var(--gap-size);
      background: #111;
      padding: calc(var(--gap-size) * 2);
      border-radius: 12px;
      touch-action: none;
      max-width: 100%;          /* prevent overflow */
      margin: 0 auto;           /* center grid */
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      background: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: calc(var(--cell-size) * 0.7);
      border-radius: 10px;
      user-select: none;
      transition: transform .15s, opacity .15s;
    }

    .dragging { transform: scale(1.12); z-index: 2; }
    .empty { opacity: 0; }

    img {
      pointer-events: none;
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 12px;
    }

    #popup {
      background: #222;
      padding: clamp(16px, 5vw, 30px) clamp(20px, 6vw, 40px);
      border-radius: 16px;
      text-align: center;
      font-size: clamp(14px, 4vw, 22px);
      line-height: 1.5;
      max-width: 92vw;
    }

    /* extra small phones */
    @media (max-width: 360px) {
      :root {
        --cell-size: min(12.5vw, 50px);
      }
    }
  </style>
</head>
<body>
<h1 style="position:absolute;top:12px;left:0;right:0;text-align:center;font-size:28px;margin:0;color:#ffd740;letter-spacing:1px;">BARISKAN MENTERI DAN KUMPULKAN 9 RAJA</h1>
<div id="wrap" style="margin-top:48px;">
  <div id="hud">
    <div id="score">Skor: 0</div>
    <div id="time">Waktu: 0.0s</div>
  </div>
  <div id="game"></div>
</div>

<div id="overlay"><div id="popup"></div></div>

<script>
  const width = 8;
  const TARGET_MULYONO = 9;
  const MULYONO_IMAGE = 'solo.png';

  const shapes = [
    { icon: '▲', color: '#ff5252' },
    { icon: '■', color: '#40c4ff' },
    { icon: '●', color: '#69f0ae' },
    { icon: '★', color: '#ffd740' },
    { icon: '⬟', color: '#b388ff' }
  ];

  const specialImages = [
    { weight: 3, image: 'balil.png' },
    { weight: 3, image: 'pigui.png' },
    { weight: 3, image: 'zulhas.png' },
    { weight: 3, image: 'saroni.png' }
  ];

  const board = [];
  let dragIndex = null;
  let gameOver = false;
  let mulyonoCount = 0;
  let score = 0;

  // stopwatch
  let startTime = 0;
  let timerHandle = null;

  const game = document.getElementById('game');
  const overlay = document.getElementById('overlay');
  const popup = document.getElementById('popup');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');

  /* ---------- helpers ---------- */

  function randomShape() {
    return shapes[Math.floor(Math.random() * shapes.length)];
  }

  function weightedSpecial() {
    const pool = [];
    specialImages.forEach(s => {
      for (let i = 0; i < s.weight; i++) pool.push(s);
    });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function addScore(delta) {
    score += delta;
    scoreEl.textContent = 'Skor: ' + score.toLocaleString('id-ID');
  }

  function startTimer() {
    startTime = performance.now();
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(() => {
      if (gameOver) return;
      const sec = (performance.now() - startTime) / 1000;
      timeEl.textContent = 'Waktu: ' + sec.toFixed(1) + 's';
    }, 100);
  }

  function stopTimer() {
    if (timerHandle) clearInterval(timerHandle);
  }

  /* ---------- render & state ---------- */

  function setCell(cell, data) {
    cell.innerHTML = '';

    if (!data) {
      cell.dataset.type = 'empty';
      cell.dataset.value = '';
      cell.dataset.special = '';
      cell.dataset.color = '';
      cell.style.color = '';
      cell.classList.add('empty');
      return;
    }

    cell.dataset.type = data.type;
    cell.dataset.value = data.value || '';
    cell.dataset.special = data.special || '';
    cell.dataset.color = data.color || '';
    cell.classList.remove('empty');

    if (data.image) {
      const img = document.createElement('img');
      img.src = data.image;
      img.style.width = '80%';
      img.style.height = '80%';
      img.style.objectFit = 'contain';
      img.draggable = false;
      cell.appendChild(img);
      cell.style.color = '';
    } else {
      cell.textContent = data.value;
      cell.style.color = data.color;
    }
  }

  function getCellData(cell) {
    if (cell.dataset.type === 'empty') return null;
    return {
      type: cell.dataset.type,
      value: cell.dataset.value,
      special: cell.dataset.special,
      color: cell.dataset.color,
      image: cell.querySelector('img') ? cell.querySelector('img').src : null
    };
  }

  /* ---------- board ---------- */

  function createBoard() {
    game.innerHTML = '';
    board.length = 0;
    gameOver = false;
    mulyonoCount = 0;
    score = 0;
    scoreEl.textContent = 'Skor: 0';
    overlay.style.display = 'none';

    for (let i = 0; i < width * width; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;

      const s = randomShape();
      setCell(cell, { type: 'shape', value: s.icon, color: s.color });
      addTouch(cell);

      board.push(cell);
      game.appendChild(cell);
    }

    startTimer();
  }

  /* ---------- input ---------- */

  function addTouch(cell) {
    cell.addEventListener('pointerdown', (e) => {
      if (gameOver) return;
      e.preventDefault();
      dragIndex = Number(cell.dataset.index);
      cell.classList.add('dragging');
      cell.setPointerCapture(e.pointerId);
    });

    cell.addEventListener('pointerup', endDrag);
    cell.addEventListener('pointercancel', endDrag);
  }

  // Global pointer move handler (works on mobile – no hover needed)
  document.addEventListener('pointermove', (e) => {
    if (dragIndex === null || gameOver) return;

    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el || !el.classList.contains('cell')) return;

    const target = Number(el.dataset.index);
    if (target !== dragIndex) {
      swapCells(dragIndex, target);
      dragIndex = target;
    }
  });

  function endDrag() {
    if (gameOver) return;
    board.forEach(c => c.classList.remove('dragging'));
    dragIndex = null;
    checkMatches();
  }

  function swapCells(a, b) {
    const da = getCellData(board[a]);
    const db = getCellData(board[b]);
    setCell(board[a], db);
    setCell(board[b], da);
    board[b].classList.add('dragging');
  }

  /* ---------- scoring helpers ---------- */

  // match 3 = 1 point, then x2 for each extra tile
  function scoreForNormalMatch(n) {
    if (n < 3) return 0;
    return Math.pow(2, n - 3);
  }

  /* ---------- match logic ---------- */

  function checkMatches() {
    if (gameOver) return;

    board.forEach(c => c.classList.remove('to-clear'));

    // ---- SHAPE horizontal ----
    for (let r = 0; r < width; r++) {
      const base = r * width;
      let count = 1;
      for (let c = 1; c <= width; c++) {
        const prev = board[base + c - 1];
        const curr = c < width ? board[base + c] : null;
        if (curr && curr.dataset.value === prev.dataset.value && prev.dataset.type === 'shape') {
          count++;
        } else {
          if (count >= 3 && prev.dataset.type === 'shape') {
            for (let k = 0; k < count; k++) {
              board[base + c - 1 - k].classList.add('to-clear');
            }
            addScore(scoreForNormalMatch(count));
          }
          count = 1;
        }
      }
    }

    // ---- SHAPE vertical ----
    for (let c = 0; c < width; c++) {
      let count = 1;
      for (let r = 1; r <= width; r++) {
        const prev = board[(r - 1) * width + c];
        const curr = r < width ? board[r * width + c] : null;
        if (curr && curr.dataset.value === prev.dataset.value && prev.dataset.type === 'shape') {
          count++;
        } else {
          if (count >= 3 && prev.dataset.type === 'shape') {
            for (let k = 0; k < count; k++) {
              board[(r - 1 - k) * width + c].classList.add('to-clear');
            }
            addScore(scoreForNormalMatch(count));
          }
          count = 1;
        }
      }
    }

    // ---- SPECIAL IMAGE: only match FULL ROW (8) ----
    for (let r = 0; r < width; r++) {
      const base = r * width;
      const row = board.slice(base, base + width);
      const allSpecial = row.every(c => c.dataset.type === 'special' && c.dataset.special === 'normal');
      if (allSpecial) {
        row.forEach(c => c.classList.add('to-clear'));
        // fixed score for image match
        addScore(1000);
      }
    }

    const cleared = board.filter(c => c.classList.contains('to-clear'));

    // ---- spawn Mulyono ONLY if match >= 9 shapes cleared at once ----
    if (cleared.length >= 9) {
      const target = cleared[Math.floor(Math.random() * cleared.length)];
      setTimeout(() => {
        setCell(target, { type: 'special', value: '', image: MULYONO_IMAGE, special: 'mulyono' });
        mulyonoCount++;

        // bonus score when collected 9 mulyono
        if (mulyonoCount >= TARGET_MULYONO) {
          addScore(11_000_000);
          endGame();
        }
      }, 150);
    }

    // ---- clear ----
    cleared.forEach(c => setCell(c, null));

    // ---- spawn normal special for match 5–8 ----
    if (cleared.length >= 5 && cleared.length < 9) {
      const target = cleared[Math.floor(Math.random() * cleared.length)];
      setTimeout(() => {
        const sp = weightedSpecial();
        setCell(target, { type: 'special', value: '', image: sp.image, special: 'normal' });
      }, 150);
    }

    if (cleared.length > 0) setTimeout(dropShapes, 300);
  }

  function endGame() {
    gameOver = true;
    stopTimer();
    const totalSec = (performance.now() - startTime) / 1000;
    popup.innerHTML = `🎉 GAME SELESAI 🎉<br/>
      <b>Mulyono:</b> ${TARGET_MULYONO}<br/>
      <b>Skor:</b> ${score.toLocaleString('id-ID')}<br/>
      <b>Waktu:</b> ${totalSec.toFixed(1)} detik`;
    overlay.style.display = 'flex';
  }

  /* ---------- gravity ---------- */

  function dropShapes() {
    if (gameOver) return;

    for (let col = 0; col < width; col++) {
      const stack = [];
      for (let row = width - 1; row >= 0; row--) {
        const d = getCellData(board[row * width + col]);
        if (d) stack.push(d);
      }
      for (let row = width - 1; row >= 0; row--) {
        const idx = row * width + col;
        if (stack.length) setCell(board[idx], stack.shift());
        else {
          const s = randomShape();
          setCell(board[idx], { type: 'shape', value: s.icon, color: s.color });
        }
      }
    }

    setTimeout(checkMatches, 200);
  }

  /* ---------- tests ---------- */

  function runSelfTests() {
    console.assert(board.length === width * width, 'Board size invalid');
    console.assert(board.every(c => c.dataset.type), 'Missing cell type');
    console.assert(board.every(c => c.dataset.type !== 'shape' || c.dataset.color), 'Shape lost color');
    console.assert(scoreForNormalMatch(3) === 1, 'Score rule 3 wrong');
    console.assert(scoreForNormalMatch(4) === 2, 'Score rule 4 wrong');
    console.assert(scoreForNormalMatch(5) === 4, 'Score rule 5 wrong');
  }

  createBoard();
  runSelfTests();
</script>
</body>
</html>
